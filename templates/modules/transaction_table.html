<div class="transaction-table">
    <div class="transaction-table__header">
        <div>
            <h3>Transaction Table</h3>
            <p id="transaction_table_status">No transactions loaded yet.</p>
        </div>
    </div>
    <div class="transaction-table__content">
        <div class="transaction-table__scroll">
            <table id="transaction_table" class="transaction-table__table">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Date</th>
                        <th>Account</th>
                        <th>Transaction Detail</th>
                        <th>L0 Category</th>
                        <th>L1 Category</th>
                        <th>L2 Category</th>
                        <th>L3 Category</th>
                        <th>Amount</th>
                        <th>Note</th>
                        <th>Save to File</th>
                        <th>Save to Cache</th>
                        <th>Cache Keyword</th>
                    </tr>
                </thead>
                <tbody id="transaction_table_body"></tbody>
            </table>
        </div>
    </div>
</div>
